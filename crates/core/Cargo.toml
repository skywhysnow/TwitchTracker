[package]
name = "tracker-core"
version = "0.1.0"
edition = "2021"
description = "Логика Twitch Tracker: прогноз, события, правила уведомлений, база SQLite"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.31", features = ["bundled"] }
